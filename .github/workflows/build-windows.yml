name: Build Windows Binaries
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: grindr-always-online
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm clang libclang-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Set boringssl/zig cross-build workaround
        run: |
          HOST_TRIPLE="$(rustc -vV | awk '/^host:/{print $2}')"
          echo "CMAKE_TOOLCHAIN_FILE_${HOST_TRIPLE//-/_}=1" >> "$GITHUB_ENV"

      - name: Build Windows x86_64
        run: cargo zigbuild --release --target x86_64-pc-windows-gnu

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          path: "target/x86_64-pc-windows-gnu/release/${{ env.APP_NAME }}.exe"
          archive: false
          retention-days: 7
